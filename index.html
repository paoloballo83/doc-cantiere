<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocCantiere Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --accent: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --whatsapp: #22c55e;
      --email: #3b82f6;
      --danger: #ef4444;
      --backup: #8b5cf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding-bottom: 14px; 
      border-bottom: 2px solid var(--primary); 
      margin-bottom: 16px; 
    }

    h1 { 
      font-size: 1.4rem; 
      color: var(--text-main); 
      font-weight: 800; 
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge { 
      background: linear-gradient(135deg, var(--primary), var(--accent)); 
      color: #000; 
      font-size: 0.7rem; 
      padding: 4px 8px; 
      border-radius: 20px; 
      font-weight: 800; 
      text-transform: uppercase;
    }
    
    .btn-main { 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      color: white; 
      border: none; 
      padding: 15px; 
      border-radius: 14px; 
      font-size: 1rem; 
      font-weight: 800; 
      width: 100%; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); 
      margin-bottom: 10px;
    }

    .btn-backup {
      background: linear-gradient(135deg, var(--backup), #6d28d9);
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .btn-main:active { transform: scale(0.98); }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0 20px 0;
    }

    .dash-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .dash-full {
      grid-column: span 2;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(249, 115, 22, 0.3);
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }

    .dash-title { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; text-transform: uppercase; }
    .dash-value { font-size: 1.3rem; color: var(--accent); font-weight: 800; margin-top: 2px; }
    .dash-clock { font-size: 0.85rem; color: var(--text-main); font-weight: 700; }

    .modal-add {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--primary);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 16px;
      gap: 10px;
      flex-direction: column;
    }

    .modal-add.attiva { display: flex; }

    .input-text {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      width: 100%;
    }

    .modal-actions { display: flex; gap: 8px; }
    .btn-confirm { background: var(--whatsapp); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; }
    .btn-cancel { background: var(--danger); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; }

    .folder-card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: 16px; 
      padding: 16px; 
      margin-bottom: 16px; 
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); 
    }

    .folder-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      font-weight: 700; 
      font-size: 1.1rem; 
      color: var(--text-main); 
    }

    .folder-title { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      flex-grow: 1; 
    }

    .folder-content { 
      display: block; 
      margin-top: 12px; 
      border-top: 1px solid var(--card-border); 
      padding-top: 12px; 
    }
    
    .file-list { margin-top: 10px; }

    .file-item { 
      display: flex; 
      flex-direction: column;
      gap: 6px;
      padding: 12px; 
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .file-main-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .file-name { 
      cursor: pointer; 
      color: var(--accent); 
      font-weight: 600;
      font-size: 0.95rem; 
      word-break: break-all;
    }

    .img-preview {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 4px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      background: #fff;
    }

    .file-date {
      font-size: 0.75rem;
      color: var(--text-sub);
    }
    
    .file-actions { 
      display: flex; 
      align-items: center; 
      justify-content: flex-end;
      gap: 8px; 
      margin-top: 6px;
    }

    .btn-action { 
      border: none; 
      color: #fff; 
      padding: 10px 14px; 
      border-radius: 8px; 
      font-size: 0.85rem; 
      font-weight: 700;
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center;
      gap: 6px; 
      flex: 1;
    }

    .btn-whatsapp { background: var(--whatsapp); }
    .btn-email { background: var(--email); }
    .btn-delete { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; flex: none; }
    
    .btn-sub { 
      background: #0f172a; 
      border: 1px dashed var(--primary); 
      font-size: 0.85rem; 
      padding: 12px; 
      width: 100%; 
      margin-top: 6px; 
      color: var(--primary); 
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty { color: var(--text-sub); font-size: 0.85rem; font-style: italic; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>🏗️ DocCantiere</h1>
    <span class="badge">PRO</span>
  </header>

  <button class="btn-main" onclick="mostraFormCantiere()">➕ Nuovo Cantiere</button>
  <button class="btn-main btn-backup" onclick="eseguiBackupPDF()">📦 Backup PDF e Invia Email</button>

  <div id="formCantiere" class="modal-add">
    <input type="text" id="nomeCantiereInput" class="input-text" placeholder="Nome cantiere (es. Via Roma 12)...">
    <div class="modal-actions">
      <button class="btn-confirm" onclick="confermaNuovoCantiere()">Salva</button>
      <button class="btn-cancel" onclick="nascondiFormCantiere()">Annulla</button>
    </div>
  </div>

  <div class="dashboard">
    <div class="dash-card dash-full">
      <div>
        <div class="dash-title">📅 Data & Ora</div>
        <div class="dash-clock" id="clockBox">--/--/---- --:--</div>
      </div>
      <span style="font-size: 1.4rem;">⏱️</span>
    </div>
    <div class="dash-card">
      <div class="dash-title">📂 Cantieri</div>
      <div class="dash-value" id="cntCantieri">0</div>
    </div>
    <div class="dash-card">
      <div class="dash-title">📄 File Totali</div>
      <div class="dash-value" id="cntFile">0</div>
    </div>
  </div>

  <input type="file" id="fileInputGlobale" style="display:none;" accept="image/*,.pdf" onchange="gestisciFileSelezionato(event)">

  <div id="listaCantieri"></div>

  <script>
    const PASSWORD_SICUREZZA = "1234";
    let cantieri = JSON.parse(localStorage.getItem('doc_cantiere_salvati_v29')) || [];
    let cantiereCorrenteId = null;

    function aggiornaOrologio() {
      const ora = new Date();
      const giorni = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
      const nomeGiorno = giorni[ora.getDay()];
      const gg = String(ora.getDate()).padStart(2, '0');
      const mm = String(ora.getMonth() + 1).padStart(2, '0');
      const aaaa = ora.getFullYear();
      const hh = String(ora.getHours()).padStart(2, '0');
      const min = String(ora.getMinutes()).padStart(2, '0');
      const sec = String(ora.getSeconds()).padStart(2, '0');

      document.getElementById('clockBox').innerText = `${nomeGiorno} ${gg}/${mm}/${aaaa} - ${hh}:${min}:${sec}`;
    }
    setInterval(aggiornaOrologio, 1000);
    aggiornaOrologio();

    function salvaDati() {
      localStorage.setItem('doc_cantiere_salvati_v29', JSON.stringify(cantieri));
      mostraCantieri();
    }

    function mostraFormCantiere() {
      document.getElementById('formCantiere').classList.add('attiva');
      document.getElementById('nomeCantiereInput').focus();
    }

    function nascondiFormCantiere() {
      document.getElementById('formCantiere').classList.remove('attiva');
      document.getElementById('nomeCantiereInput').value = '';
    }

    function confermaNuovoCantiere() {
      let input = document.getElementById('nomeCantiereInput');
      let nome = input.value.trim();
      if (nome !== "") {
        cantieri.push({ id: Date.now(), nome: nome, files: [] });
        salvaDati();
        nascondiFormCantiere();
      } else {
        alert("Inserisci un nome valido.");
      }
    }

    function verificaSicurezza() {
      let pwd = prompt("🔒 Inserisci la password di sicurezza (1234) per procedere:");
      if (pwd === null) return false;
      if (pwd !== PASSWORD_SICUREZZA) {
        alert("❌ Password errata. Operazione annullata.");
        return false;
      }
      return true;
    }

    function eliminaCantiere(id) {
      if (!verificaSicurezza()) return;
      cantieri = cantieri.filter(c => c.id !== id);
      salvaDati();
    }

    function eliminaFile(cantiereId, fileId) {
      if (!verificaSicurezza()) return;
      let cantiere = cantieri.find(c => c.id === cantiereId);
      if (cantiere) {
        cantiere.files = cantiere.files.filter(f => f.id !== fileId);
        salvaDati();
      }
    }

    function avviaCaricamento(idCantiere) {
      cantiereCorrenteId = idCantiere;
      let input = document.getElementById('fileInputGlobale');
      input.value = '';
      input.click();
    }

    function gestisciFileSelezionato(e) {
      const file = e.target.files[0];
      if (!file || !cantiereCorrenteId) return;

      const cantiere = cantieri.find(c => c.id === cantiereCorrenteId);
      if (!cantiere) return;

      const ora = new Date();
      const dataStr = `${String(ora.getDate()).padStart(2, '0')}/${String(ora.getMonth() + 1).padStart(2, '0')}/${ora.getFullYear()} - ${String(ora.getHours()).padStart(2, '0')}:${String(ora.getMinutes()).padStart(2, '0')}`;

      const reader = new FileReader();

      if (file.type.startsWith('image/')) {
        reader.onload = function(event) {
          const img = new Image();
          img.src = event.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxW = 1000;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);

            cantiere.files.push({
              id: Date.now(),
              nome: file.name,
              dataUrl: compressedBase64,
              data: dataStr,
              isFoto: true
            });
            salvaDati();
          };
        };
        reader.readAsDataURL(file);
      } else {
        reader.onload = function(event) {
          cantiere.files.push({
            id: Date.now(),
            nome: file.name,
            dataUrl: event.target.result,
            data: dataStr,
            isFoto: false
          });
          salvaDati();
        };
        reader.readAsDataURL(file);
      }
    }

    // Metodo alternativo sicuro: forza il download pulito del file così Android lo apre con il lettore esterno predefinito
    function apriFile(f) {
      try {
        let a = document.createElement('a');
        a.href = f.dataUrl;
        a.download = f.nome;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch(e) {
        alert("Impossibile aprire il file.");
      }
    }

    function inviaWhatsApp(f) {
      apriFile(f);
      alert(`📥 File "${f.nome}" scaricato sul telefono!\nOra si apre WhatsApp: tocca la graffetta 📎 e allega il file.`);
      setTimeout(() => {
        let testo = encodeURIComponent(`Documento Cantiere: ${f.nome} (Caricato: ${f.data})`);
        window.location.href = `whatsapp://send?text=${testo}`;
      }, 800);
    }

    function inviaEmail(f) {
      apriFile(f);
      alert(`📥 File "${f.nome}" scaricato sul telefono!\nOra si apre l'Email: inserisci il destinatario e allega il file.`);
      setTimeout(() => {
        let oggetto = encodeURIComponent(`Documento Cantiere: ${f.nome}`);
        let corpo = encodeURIComponent(`In allegato trovi il documento: ${f.nome}\nCaricato il: ${f.data}`);
        window.location.href = `mailto:?subject=${oggetto}&body=${corpo}`;
      }, 800);
    }

    function eseguiBackupPDF() {
      if (cantieri.length === 0) {
        alert("Nessun cantiere presente per il backup.");
        return;
      }

      try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        
        pdf.setFontSize(18);
        pdf.setTextColor(249, 115, 22);
        pdf.text("DocCantiere - Report Backup Generale", 14, 20);

        pdf.setFontSize(10);
        pdf.setTextColor(100, 100, 100);
        pdf.text(`Generato il: ${new Date().toLocaleString()}`, 14, 28);
        pdf.line(14, 32, 196, 32);

        let y = 40;
        cantieri.forEach((c, index) => {
          if (y > 270) { pdf.addPage(); y = 20; }
          pdf.setFontSize(14);
          pdf.setTextColor(30, 41, 59);
          pdf.text(`Cantiere [${index + 1}]: ${c.nome}`, 14, y);
          y += 8;

          if (c.files.length === 0) {
            pdf.setFontSize(10);
            pdf.setTextColor(150, 150, 150);
            pdf.text("  - Nessun documento o foto presente", 18, y);
            y += 8;
          } else {
            c.files.forEach(f => {
              if (y > 275) { pdf.addPage(); y = 20; }
              pdf.setFontSize(10);
              pdf.setTextColor(50, 50, 50);
              let tipoText = f.isFoto ? "[FOTO]" : "[PDF]";
              pdf.text(`  • ${tipoText} ${f.nome} (Caricato: ${f.data})`, 18, y);
              y += 6;
            });
          }
          y += 6;
        });

        const pdfDataUri = pdf.output('datauristring');
        let a = document.createElement('a');
        a.href = pdfDataUri;
        a.download = `Backup_DocCantiere_${Date.now()}.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        alert("📦 Backup PDF scaricato sul telefono!\nOra si apre l'email: allega il report appena scaricato.");
        setTimeout(() => {
          let oggetto = encodeURIComponent("Backup Generale DocCantiere");
          let corpo = encodeURIComponent("In allegato il report generale dei cantieri (il file PDF è salvato nella cartella Download del telefono).");
          window.location.href = `mailto:?subject=${oggetto}&body=${corpo}`;
        }, 800);

      } catch (err) {
        alert("Errore nella creazione del backup.");
      }
    }

    function mostraCantieri() {
      let container = document.getElementById('listaCantieri');
      container.innerHTML = '';

      document.getElementById('cntCantieri').innerText = cantieri.length;
      let totaleFile = cantieri.reduce((acc, c) => acc + c.files.length, 0);
      document.getElementById('cntFile').innerText = totaleFile;

      if (cantieri.length === 0) {
        container.innerHTML = '<div class="empty" style="padding: 30px 0;">Nessun cantiere aperto.<br>Clicca su "Nuovo Cantiere" per iniziare.</div>';
        return;
      }

      cantieri.forEach(c => {
        let html = `
          <div class="folder-card">
            <div class="folder-header">
              <div class="folder-title">
                <span>📁</span> <span>${c.nome}</span>
              </div>
              <button class="btn-delete" onclick="eliminaCantiere(${c.id})">🗑️</button>
            </div>
            
            <div class="folder-content">
              <button class="btn-sub" onclick="avviaCaricamento(${c.id})">📸📄 Aggiungi Foto o PDF</button>
              <div class="file-list">
                ${c.files.length === 0 ? '<div class="empty">Nessun documento inserito</div>' : ''}
                ${c.files.map(f => `
                  <div class="file-item">
                    <div class="file-main-info">
                      <span class="file-name" onclick='apriFile(${JSON.stringify(f)})'>${f.isFoto ? '📷' : '📄'} ${f.nome}</span>
                      <button class="btn-delete" onclick="eliminaFile(${c.id}, ${f.id})">🗑️</button>
                    </div>
                    ${f.isFoto ? `<img src="${f.dataUrl}" class="img-preview" onclick='apriFile(${JSON.stringify(f)})'>` : ''}
                    <div class="file-date">📅 Caricato: ${f.data}</div>
                    <div class="file-actions">
                      <button class="btn-action btn-whatsapp" onclick='inviaWhatsApp(${JSON.stringify(f)})'>💬 WhatsApp</button>
                      <button class="btn-action btn-email" onclick='inviaEmail(${JSON.stringify(f)})'>✉️ Email</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    mostraCantieri();
  </script>
</body>
</html>
