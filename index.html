<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocCantiere</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d0e12; color: #f0f2f5; padding: 16px; padding-bottom: 80px; }
    header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid #2a2d34; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; color: #fff; font-weight: 700; }
    .badge { background: #2563eb; color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; font-weight: 600; }
    .btn { background: #2563eb; color: white; border: none; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .btn:active { background: #1d4ed8; }
    .folder-card { background: #16181e; border: 1px solid #2a2d34; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .folder-header { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 1.1rem; color: #fff; cursor: pointer; }
    .folder-title { display: flex; align-items: center; gap: 8px; flex-grow: 1; }
    .folder-content { display: none; margin-top: 12px; border-top: 1px solid #2a2d34; padding-top: 10px; }
    .folder-content.aperta { display: block; }
    
    .subfolder-container { margin-left: 12px; margin-top: 10px; border-left: 2px solid #2a2d34; padding-left: 12px; }
    .subfolder-header { display: flex; align-items: center; justify-content: space-between; font-size: 0.95rem; font-weight: 600; color: #93c5fd; margin-top: 8px; cursor: pointer; }
    .subfolder-content { display: none; margin-top: 6px; padding-left: 6px; }
    .subfolder-content.aperta { display: block; }

    .file-list { margin-top: 8px; }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; color: #c9d1d9; }
    .file-name { cursor: pointer; color: #60a5fa; text-decoration: underline; flex-grow: 1; margin-right: 8px; word-break: break-all; }
    .file-actions { display: flex; align-items: center; gap: 6px; }
    .file-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 700; }
    .pdf { background: #7f1d1d; color: #fca5a5; }
    .doc { background: #1e3a8a; color: #bfdbfe; }
    .xls { background: #14532d; color: #bbf7d0; }
    .img { background: #581c87; color: #e9d5ff; }
    .btn-delete { background: none; border: none; color: #ef4444; font-size: 0.9rem; cursor: pointer; padding: 2px 4px; }
    .btn-sub { background: #374151; font-size: 0.8rem; padding: 6px 10px; width: auto; margin-top: 6px; }
    .empty { color: #6b7280; font-size: 0.8rem; font-style: italic; margin-top: 4px; }
    input[type="file"] { display: none; }
    
    #modalAnteprima { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
    #modalAnteprima img { max-width: 100%; max-height: 80vh; border-radius: 8px; }
    #modalAnteprima button { margin-top: 20px; background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>🏗️ DocCantiere</h1>
    <span class="badge">Offline Pro v5</span>
  </header>

  <button class="btn" onclick="nuovoCantiere()">➕ Nuovo Cantiere</button>
  <button class="btn" style="background:#059669;" onclick="preparaCaricamentoGenerico()">📷 Importa File / Foto</button>
  <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" onchange="caricaFile(event)">

  <div id="listaCantieri"></div>

  <div id="modalAnteprima" onclick="chiudiAnteprima()">
    <img id="imgVisualizzata" src="" alt="Anteprima">
    <button onclick="chiudiAnteprima()">Chiudi</button>
  </div>

  <script>
    const PASSWORD_ELIMINAZIONE = "1234";

    let db = JSON.parse(localStorage.getItem('doc_cantiere_db_v5')) || [];
    let cartelleAperte = JSON.parse(localStorage.getItem('doc_cantiere_stati_v5')) || {};
    let targetCaricamento = null;

    function salvaDB() {
      try {
        localStorage.setItem('doc_cantiere_db_v5', JSON.stringify(db));
        mostraCantieri();
      } catch (e) {
        alert("⚠️ Memoria del browser esaurita! Elimina qualche vecchio file o cantiere per liberare spazio.");
      }
    }

    function salvaStati() {
      localStorage.setItem('doc_cantiere_stati_v5', JSON.stringify(cartelleAperte));
    }

    function toggleCartella(id) {
      cartelleAperte[id] = !cartelleAperte[id];
      salvaStati();
      mostraCantieri();
    }

    function nuovoCantiere() {
      let nome = prompt("Nome del nuovo cantiere:");
      if (nome && nome.trim() !== "") {
        let id = Date.now();
        db.push({ id: id, nome: nome.trim(), sottocartelle: [], file: [] });
        cartelleAperte[id] = true;
        salvaStati();
        salvaDB();
      }
    }

    function eliminaCantiere(id) {
      let cantiere = db.find(c => c.id === id);
      if (!cantiere) return;
      if (!confirm(`⚠️ Vuoi eliminare il cantiere "${cantiere.nome}"?`)) return;
      let pwd = prompt("🔒 Inserisci la password per confermare:");
      if (pwd !== PASSWORD_ELIMINAZIONE) {
        alert("❌ Password errata.");
        return;
      }
      db = db.filter(c => c.id !== id);
      salvaDB();
    }

    function nuovaSottocartella(cantiereId) {
      let nome = prompt("Nome della sottocartella (es. Fatture, Sicurezza, Permessi):");
      if (nome && nome.trim() !== "") {
        let cantiere = db.find(c => c.id === cantiereId);
        if (cantiere) {
          let subId = Date.now();
          cantiere.sottocartelle.push({ id: subId, nome: nome.trim(), file: [] });
          cartelleAperte[subId] = true;
          salvaStati();
          salvaDB();
        }
      }
    }

    function eliminaSottocartella(cantiereId, subId) {
      if (!confirm("Vuoi eliminare questa sottocartella e i suoi file?")) return;
      let cantiere = db.find(c => c.id === cantiereId);
      if (cantiere) {
        cantiere.sottocartelle = cantiere.sottocartelle.filter(s => s.id !== subId);
        salvaDB();
      }
    }

    function eliminaFile(cantiereId, fileId, subId = null) {
      let cantiere = db.find(c => c.id === cantiereId);
      if (!cantiere) return;
      if (subId) {
        let sub = cantiere.sottocartelle.find(s => s.id === subId);
        if (sub) sub.file = sub.file.filter(f => f.id !== fileId);
      } else {
        cantiere.file = cantiere.file.filter(f => f.id !== fileId);
      }
      salvaDB();
    }

    function preparaCaricamento(cantiereId, subId = null) {
      targetCaricamento = { cantiereId, subId };
      document.getElementById('fileInput').click();
    }

    function preparaCaricamentoGenerico() {
      if (db.length === 0) {
        alert("Crea prima un cantiere!");
        return;
      }
      let opzioni = [];
      let riferimenti = [];

      db.forEach(c => {
        opzioni.push(`📁 Cantiere: ${c.nome}`);
        riferimenti.push({ cantiereId: c.id, subId: null });
        c.sottocartelle.forEach(s => {
          opzioni.push(`   📂 ${c.nome} ➔ ${s.nome}`);
          riferimenti.push({ cantiereId: c.id, subId: s.id });
        });
      });

      let testoScelta = "Scegli dove salvare il file:\n\n" + opzioni.map((o, i) => `${i + 1}. ${o}`).join("\n");
      let scelta = prompt(testoScelta);
      let indice = parseInt(scelta) - 1;

      if (!isNaN(indice) && riferimenti[indice]) {
        preparaCaricamento(riferimenti[indice].cantiereId, riferimenti[indice].subId);
      } else if (scelta !== null) {
        alert("Scelta non valida.");
      }
    }

    function caricaFile(e) {
      if (!e.target.files.length || !targetCaricamento) return;
      let f = e.target.files[0];
      let ext = f.name.split('.').pop().toLowerCase();
      let tipo = 'doc';
      if (['jpg', 'jpeg', 'png'].includes(ext)) tipo = 'img';
      if (ext === 'pdf') tipo = 'pdf';
      if (['xls', 'xlsx'].includes(ext)) tipo = 'xls';

      let reader = new FileReader();
      
      if (tipo === 'img') {
        // Ridimensiona automaticamente le immagini per non intasare la memoria
        reader.onload = function(event) {
          let img = new Image();
          img.onload = function() {
            let canvas = document.createElement('canvas');
            let ctx = canvas.getContext('2d');
            let MAX_WIDTH = 1024;
            let MAX_HEIGHT = 1024;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            
            let compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
            salvaNuovoFileNelDb(f.name, tipo, compressedDataUrl);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(f);
      } else {
        // Per PDF e documenti standard
        reader.onload = function(event) {
          salvaNuovoFileNelDb(f.name, tipo, event.target.result);
        };
        reader.readAsDataURL(f);
      }
      e.target.value = '';
    }

    function salvaNuovoFileNelDb(nomeFile, tipo, datiFile) {
      let cantiere = db.find(c => c.id === targetCaricamento.cantiereId);
      if (cantiere) {
        let nuovoFileObj = { id: Date.now(), nome: nomeFile, tipo: tipo, dati: datiFile };
        if (targetCaricamento.subId) {
          let sub = cantiere.sottocartelle.find(s => s.id === targetCaricamento.subId);
          if (sub) sub.file.push(nuovoFileObj);
        } else {
          cantiere.file.push(nuovoFileObj);
        }
        cartelleAperte[targetCaricamento.cantiereId] = true;
        if (targetCaricamento.subId) cartelleAperte[targetCaricamento.subId] = true;
        salvaStati();
        salvaDB();
        alert("File caricato e compresso con successo!");
      }
      targetCaricamento = null;
    }

    function apriFile(dati, tipo) {
      if (!dati) {
        alert("Impossibile aprire questo file. Ricaricalo.");
        return;
      }
      if (tipo === 'img') {
        document.getElementById('imgVisualizzata').src = dati;
        document.getElementById('modalAnteprima').style.display = 'flex';
      } else {
        let w = window.open('');
        w.document.write(`<iframe src="${dati}" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;" allowfullscreen></iframe>`);
      }
    }

    function chiudiAnteprima() {
      document.getElementById('modalAnteprima').style.display = 'none';
    }

    function mostraCantieri() {
      let container = document.getElementById('listaCantieri');
      container.innerHTML = '';
      if (db.length === 0) {
        container.innerHTML = '<div class="empty" style="text-align:center; padding: 20px;">Nessun cantiere presente. Clicca su "Nuovo Cantiere" per iniziare.</div>';
        return;
      }

      db.forEach(c => {
        let cantiereAperto = cartelleAperte[c.id] ? 'aperta' : '';
        let frecciaCantiere = cartelleAperte[c.id] ? '▼' : '▶';

        let html = `
          <div class="folder-card">
            <div class="folder-header">
              <div class="folder-title" onclick="toggleCartella(${c.id})">
                <span>${frecciaCantiere} 📁</span> <span>${c.nome}</span>
              </div>
              <button class="btn-delete" onclick="eliminaCantiere(${c.id})" title="Elimina cantiere">🗑️</button>
            </div>
            
            <div class="folder-content ${cantiereAperto}">
              <button class="btn btn-sub" onclick="nuovaSottocartella(${c.id})">📂 + Aggiungi Sottocartella</button>
              <button class="btn btn-sub" style="background:#059669;" onclick="preparaCaricamento(${c.id})">📄 + Carica qui</button>

              <!-- File diretti del cantiere -->
              <div class="file-list">
                ${c.file.map(f => `
                  <div class="file-item">
                    <span class="file-name" onclick="apriFile('${f.dati}', '${f.tipo}')">📄 ${f.nome}</span>
                    <div class="file-actions">
                      <span class="file-badge ${f.tipo}">${f.tipo}</span>
                      <button class="btn-delete" onclick="eliminaFile(${c.id}, ${f.id})">🗑️</button>
                    </div>
                  </div>
                `).join('')}
              </div>

              <!-- Sottocartelle -->
              <div class="subfolder-container">
                ${c.sottocartelle.map(s => {
                  let subAperta = cartelleAperte[s.id] ? 'aperta' : '';
                  let frecciaSub = cartelleAperte[s.id] ? '▼' : '▶';
                  return `
                    <div>
                      <div class="subfolder-header">
                        <span onclick="toggleCartella(${s.id})">${frecciaSub} 📂 ${s.nome}</span>
                        <div class="file-actions">
                          <button class="btn btn-sub" style="padding:2px 6px; font-size:0.7rem;" onclick="preparaCaricamento(${c.id}, ${s.id})">+ File</button>
                          <button class="btn-delete" onclick="eliminaSottocartella(${c.id}, ${s.id})">🗑️</button>
                        </div>
                      </div>
                      <div class="subfolder-content ${subAperta}">
                        <div class="file-list">
                          ${s.file.length === 0 ? '<div class="empty">Nessun file</div>' : ''}
                          ${s.file.map(f => `
                            <div class="file-item">
                              <span class="file-name" onclick="apriFile('${f.dati}', '${f.tipo}')">📄 ${f.nome}</span>
                              <div class="file-actions">
                                <span class="file-badge ${f.tipo}">${f.tipo}</span>
                                <button class="btn-delete" onclick="eliminaFile(${c.id}, ${f.id}, ${s.id})">🗑️</button>
                              </div>
                            </div>
                          `).join('')}
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

          </div>
        `;
        container.innerHTML += html;
      });
    }

    mostraCantieri();
  </script>
</body>
</html>
