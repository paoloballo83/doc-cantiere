<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocCantiere Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --accent: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --whatsapp: #22c55e;
      --email: #3b82f6;
      --danger: #ef4444;
      --backup: #8b5cf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding-bottom: 14px; 
      border-bottom: 2px solid var(--primary); 
      margin-bottom: 16px; 
    }

    h1 { 
      font-size: 1.4rem; 
      color: var(--text-main); 
      font-weight: 800; 
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge { 
      background: linear-gradient(135deg, var(--primary), var(--accent)); 
      color: #000; 
      font-size: 0.7rem; 
      padding: 4px 8px; 
      border-radius: 20px; 
      font-weight: 800; 
      text-transform: uppercase;
    }
    
    .btn-main { 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      color: white; 
      border: none; 
      padding: 15px; 
      border-radius: 14px; 
      font-size: 1rem; 
      font-weight: 800; 
      width: 100%; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); 
      margin-bottom: 10px;
    }

    .btn-backup {
      background: linear-gradient(135deg, var(--backup), #6d28d9);
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .btn-main:active { transform: scale(0.98); }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0 20px 0;
    }

    .dash-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .dash-full {
      grid-column: span 2;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(249, 115, 22, 0.3);
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }

    .dash-title { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; text-transform: uppercase; }
    .dash-value { font-size: 1.3rem; color: var(--accent); font-weight: 800; margin-top: 2px; }
    .dash-clock { font-size: 0.85rem; color: var(--text-main); font-weight: 700; }

    .modal-add {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--primary);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 16px;
      gap: 10px;
      flex-direction: column;
    }

    .modal-add.attiva { display: flex; }

    .input-text {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      width: 100%;
    }

    .modal-actions { display: flex; gap: 8px; }
    .btn-confirm { background: var(--whatsapp); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; }
    .btn-cancel { background: var(--danger); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; }

    .folder-card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: 16px; 
      padding: 16px; 
      margin-bottom: 16px; 
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); 
    }

    .folder-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      font-weight: 700; 
      font-size: 1.1rem; 
      color: var(--text-main); 
    }

    .folder-title { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      flex-grow: 1; 
    }

    .folder-content { 
      display: block; 
      margin-top: 12px; 
      border-top: 1px solid var(--card-border); 
      padding-top: 12px; 
    }
    
    .file-list { margin-top: 10px; }

    .file-item { 
      display: flex; 
      flex-direction: column;
      gap: 6px;
      padding: 12px; 
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .file-main-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .file-name { 
      cursor: pointer; 
      color: var(--accent); 
      font-weight: 600;
      font-size: 0.95rem; 
      word-break: break-all;
    }

    .img-preview {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 4px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      background: #fff;
    }

    .file-date {
      font-size: 0.75rem;
      color: var(--text-sub);
    }
    
    .file-actions { 
      display: flex; 
      align-items: center; 
      justify-content: flex-end;
      gap: 8px; 
      margin-top: 6px;
    }

    .btn-action { 
      border: none; 
      color: #fff; 
      padding: 10px 14px; 
      border-radius: 8px; 
      font-size: 0.85rem; 
      font-weight: 700;
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center;
      gap: 6px; 
      flex: 1;
    }

    .btn-whatsapp { background: var(--whatsapp); }
    .btn-email { background: var(--email); }
    .btn-delete { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; flex: none; }
    
    .btn-sub { 
      background: #0f172a; 
      border: 1px dashed var(--primary); 
      font-size: 0.85rem; 
      padding: 12px; 
      width: 100%; 
      margin-top: 6px; 
      color: var(--primary); 
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty { color: var(--text-sub); font-size: 0.85rem; font-style: italic; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>🏗️ DocCantiere</h1>
    <span class="badge">PRO</span>
  </header>

  <button class="btn-main" onclick="mostraFormCantiere()">➕ Nuovo Cantiere</button>
  <button class="btn-main btn-backup" onclick="eseguiBackupPDF()">📦 Backup PDF e Invia Email</button>

  <div id="formCantiere" class="modal-add">
    <input type="text" id="nomeCantiereInput" class="input-text" placeholder="Nome cantiere (es. Via Roma 12)...">
    <div class="modal-actions">
      <button class="btn-confirm" onclick="confermaNuovoCantiere()">Salva</button>
      <button class="btn-cancel" onclick="nascondiFormCantiere()">Annulla</button>
    </div>
  </div>

  <div class="dashboard">
    <div class="dash-card dash-full">
      <div>
        <div class="dash-title">📅 Data & Ora</div>
        <div class="dash-clock" id="clockBox">--/--/---- --:--</div>
      </div>
      <span style="font-size: 1.4rem;">⏱️</span>
    </div>
    <div class="dash-card">
      <div class="dash-title">📂 Cantieri</div>
      <div class="dash-value" id="cntCantieri">0</div>
    </div>
    <div class="dash-card">
      <div class="dash-title">📄 File Totali</div>
      <div class="dash-value" id="cntFile">0</div>
    </div>
  </div>

  <input type="file" id="fileInputGlobale" style="display:none;" accept="image/*,.pdf" onchange="gestisciFileSelezionato(event)">

  <div id="listaCantieri"></div>
