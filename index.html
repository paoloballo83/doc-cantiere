<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocCantiere Cloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #f3f4f6; padding: 16px; padding-bottom: 80px; }
    header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 2px solid #ea580c; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; color: #ffffff; font-weight: 700; }
    .badge { background: #ea580c; color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; font-weight: 600; }
    
    .btn { background: #ea580c; color: white; border: none; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; transition: background 0.2s; }
    .btn:active { background: #c2410c; }
    
    .folder-card { background: #1e1e1e; border: 1px solid #333333; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .folder-header { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 1.1rem; color: #fff; cursor: pointer; }
    .folder-title { display: flex; align-items: center; gap: 8px; flex-grow: 1; }
    .folder-content { display: none; margin-top: 12px; border-top: 1px solid #333333; padding-top: 10px; }
    .folder-content.aperta { display: block; }
    
    .subfolder-container { margin-left: 12px; margin-top: 10px; border-left: 2px solid #ea580c; padding-left: 12px; }
    .subfolder-header { display: flex; align-items: center; justify-content: space-between; font-size: 0.95rem; font-weight: 600; color: #fb923c; margin-top: 8px; cursor: pointer; }
    .subfolder-content { display: none; margin-top: 6px; padding-left: 6px; }
    .subfolder-content.aperta { display: block; }

    .file-list { margin-top: 8px; }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; color: #e5e7eb; }
    .file-name { cursor: pointer; color: #fb923c; text-decoration: underline; flex-grow: 1; margin-right: 8px; word-break: break-all; }
    .file-actions { display: flex; align-items: center; gap: 6px; }
    .file-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 700; }
    .pdf { background: #7f1d1d; color: #fca5a5; }
    .doc { background: #1e3a8a; color: #bfdbfe; }
    .xls { background: #14532d; color: #bbf7d0; }
    .img { background: #581c87; color: #e9d5ff; }
    
    .btn-delete { background: none; border: none; color: #ef4444; font-size: 0.9rem; cursor: pointer; padding: 2px 4px; }
    .btn-sub { background: #2d2d2d; border: 1px solid #444; font-size: 0.8rem; padding: 6px 10px; width: auto; margin-top: 6px; color: #fff; }
    .btn-sub:active { background: #3d3d3d; }
    
    .empty { color: #888888; font-size: 0.8rem; font-style: italic; margin-top: 4px; }
    input[type="file"] { display: none; }
    
    #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: #ea580c; font-size: 1.2rem; font-weight: bold; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; }
  </style>

  <!-- Firebase Web SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7QlLmpOEcZ-z-8EyjYuzrhy-IJdsrdkE",
      authDomain: "doccantiere-68569.firebaseapp.com",
      projectId: "doccantiere-68569",
      storageBucket: "doccantiere-68569.firebasestorage.app",
      messagingSenderId: "853840781249",
      appId: "1:853840781249:web:759217b71fed3e98a05940"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.db = db;
    window.storage = storage;
    window.fCollection = collection;
    window.fOnSnapshot = onSnapshot;
    window.fDoc = doc;
    window.fSetDoc = setDoc;
    window.fUpdateDoc = updateDoc;
    window.fDeleteDoc = deleteDoc;
    window.fRef = ref;
    window.fUploadBytes = uploadBytes;
    window.fGetDownloadURL = getDownloadURL;
    window.fDeleteObject = deleteObject;
  </script>
</head>
<body>

  <header>
    <h1>🏗️ DocCantiere</h1>
    <span class="badge">Cloud Unlimited</span>
  </header>

  <button class="btn" onclick="nuovoCantiere()">➕ Nuovo Cantiere</button>
  <button class="btn" style="background:#ca8a04;" onclick="preparaCaricamentoGenerico()">📷 Carica File nel Cloud</button>
  <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" onchange="caricaFileCloud(event)">

  <div id="listaCantieri"></div>

  <div id="loadingOverlay">
    <div id="loadingText">☁️ Caricamento sul Cloud...</div>
  </div>

  <script>
    const PASSWORD_ELIMINAZIONE = "1234";
    let cantieriData = [];
    let cartelleAperte = JSON.parse(localStorage.getItem('doc_cantiere_stati_v9')) || {};
    let targetCaricamento = null;

    function mostraLoading(testo) {
      document.getElementById('loadingText').innerText = testo;
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    function nascondiLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    // Ascolto in tempo reale dei dati da Firebase Cloud
    window.addEventListener('load', () => {
      let checkFirebase = setInterval(() => {
        if (window.db) {
          clearInterval(checkFirebase);
          const colRef = window.fCollection(window.db, "cantieri");
          window.fOnSnapshot(colRef, (snapshot) => {
            cantieriData = [];
            snapshot.forEach((docSnap) => {
              cantieriData.push({ idDoc: docSnap.id, ...docSnap.data() });
            });
            mostraCantieri();
          });
        }
      }, 200);
    });

    function salvaStati() {
      localStorage.setItem('doc_cantiere_stati_v9', JSON.stringify(cartelleAperte));
    }

    function toggleCartella(id) {
      cartelleAperte[id] = !cartelleAperte[id];
      salvaStati();
      mostraCantieri();
    }

    async function nuovoCantiere() {
      let nome = prompt("Nome del nuovo cantiere:");
      if (nome && nome.trim() !== "") {
        let idDoc = "cantiere_" + Date.now();
        await window.fSetDoc(window.fDoc(window.db, "cantieri", idDoc), {
          id: idDoc,
          nome: nome.trim(),
          sottocartelle: [],
          file: []
        });
        cartelleAperte[idDoc] = true;
        salvaStati();
      }
    }

    async function eliminaCantiere(idDoc) {
      let cantiere = cantieriData.find(c => c.idDoc === idDoc);
      if (!cantiere) return;
      if (!confirm(`⚠️ Vuoi eliminare il cantiere "${cantiere.nome}"?`)) return;
      let pwd = prompt("🔒 Inserisci la password per confermare:");
      if (pwd !== PASSWORD_ELIMINAZIONE) {
        alert("❌ Password errata.");
        return;
      }
      mostraLoading("Cancellazione in corso...");
      try {
        await window.fDeleteDoc(window.fDoc(window.db, "cantieri", idDoc));
      } catch(e) {
        alert("Errore cancellazione: " + e.message);
      }
      nascondiLoading();
    }

    async function nuovaSottocartella(idDoc) {
      let nome = prompt("Nome della sottocartella (es. Fatture, Sicurezza, Permessi):");
      if (nome && nome.trim() !== "") {
        let cantiere = cantieriData.find(c => c.idDoc === idDoc);
        if (cantiere) {
          let subId = "sub_" + Date.now();
          let subAggiornate = cantiere.sottocartelle || [];
          subAggiornate.push({ id: subId, nome: nome.trim(), file: [] });
          
          await window.fUpdateDoc(window.fDoc(window.db, "cantieri", idDoc), {
            sottocartelle: subAggiornate
          });
          cartelleAperte[subId] = true;
          salvaStati();
        }
      }
    }

    async function eliminaSottocartella(idDoc, subId) {
      let cantiere = cantieriData.find(c => c.idDoc === idDoc);
      if (!cantiere) return;
      if (!confirm("Vuoi eliminare questa sottocartella?")) return;
      let pwd = prompt("🔒 Inserisci la password:");
      if (pwd !== PASSWORD_ELIMINAZIONE) {
        alert("❌ Password errata.");
        return;
      }
      mostraLoading("Cancellazione in corso...");
      let subAggiornate = cantiere.sottocartelle.filter(s => s.id !== subId);
      await window.fUpdateDoc(window.fDoc(window.db, "cantieri", idDoc), {
        sottocartelle: subAggiornate
      });
      nascondiLoading();
    }

    function preparaCaricamento(idDoc, subId = null) {
      targetCaricamento = { idDoc, subId };
      document.getElementById('fileInput').click();
    }

    function preparaCaricamentoGenerico() {
      if (cantieriData.length === 0) {
        alert("Crea prima un cantiere!");
        return;
      }
      let opzioni = [];
      let riferimenti = [];

      cantieriData.forEach(c => {
        opzioni.push(`📁 Cantiere: ${c.nome}`);
        riferimenti.push({ idDoc: c.idDoc, subId: null });
        (c.sottocartelle || []).forEach(s => {
          opzioni.push(`   📂 ${c.nome} ➔ ${s.nome}`);
          riferimenti.push({ idDoc: c.idDoc, subId: s.id });
        });
      });

      let testoScelta = "Scegli dove catalogare il file:\n\n" + opzioni.map((o, i) => `${i + 1}. ${o}`).join("\n");
      let scelta = prompt(testoScelta);
      let indice = parseInt(scelta) - 1;

      if (!isNaN(indice) && riferimenti[indice]) {
        preparaCaricamento(riferimenti[indice].idDoc, riferimenti[indice].subId);
      } else if (scelta !== null) {
        alert("Scelta non valida.");
      }
    }

    async function caricaFileCloud(e) {
      if (!e.target.files.length || !targetCaricamento) return;
      let f = e.target.files[0];
      let ext = f.name.split('.').pop().toLowerCase();
      let tipo = 'doc';
      if (['jpg', 'jpeg', 'png'].includes(ext)) tipo = 'img';
      if (ext === 'pdf') tipo = 'pdf';
      if (['xls', 'xlsx'].includes(ext)) tipo = 'xls';

      mostraLoading("☁️ Invio file al Cloud in corso...");

      try {
        let storagePath = `file_cantiere/${Date.now()}_${f.name}`;
        let fileRef = window.fRef(window.storage, storagePath);
        
        // Upload diretto su Google Storage
        await window.fUploadBytes(fileRef, f);
        let downloadURL = await window.fGetDownloadURL(fileRef);

        let nuovoFileObj = { 
          id: "file_" + Date.now(), 
          nome: f.name, 
          tipo: tipo, 
          url: downloadURL,
          storagePath: storagePath 
        };

        let cantiere = cantieriData.find(c => c.idDoc === targetCaricamento.idDoc);
        if (cantiere) {
          if (targetCaricamento.subId) {
            let subList = cantiere.sottocartelle || [];
            let sub = subList.find(s => s.id === targetCaricamento.subId);
            if (sub) {
              sub.file = sub.file || [];
              sub.file.push(nuovoFileObj);
            }
            await window.fUpdateDoc(window.fDoc(window.db, "cantieri", targetCaricamento.idDoc), {
              sottocartelle: subList
            });
          } else {
            let fileList = cantiere.file || [];
            fileList.push(nuovoFileObj);
            await window.fUpdateDoc(window.fDoc(window.db, "cantieri", targetCaricamento.idDoc), {
              file: fileList
            });
          }
          cartelleAperte[targetCaricamento.idDoc] = true;
          if (targetCaricamento.subId) cartelleAperte[targetCaricamento.subId] = true;
          salvaStati();
        }
      } catch(err) {
        alert("❌ Errore durante il caricamento: " + err.message);
      }

      nascondiLoading();
      targetCaricamento = null;
      e.target.value = '';
    }

    async function eliminaFile(idDoc, fileId, subId = null) {
      let cantiere = cantieriData.find(c => c.idDoc === idDoc);
      if (!cantiere) return;
      if (!confirm("Rimuovere il file dal Cloud?")) return;

      mostraLoading("Cancellazione file...");

      try {
        if (subId) {
          let subList = cantiere.sottocartelle || [];
          let sub = subList.find(s => s.id === subId);
          if (sub) {
            sub.file = sub.file.filter(f => f.id !== fileId);
          }
          await window.fUpdateDoc(window.fDoc(window.db, "cantieri", idDoc), { sottocartelle: subList });
        } else {
          let fileList = (cantiere.file || []).filter(f => f.id !== fileId);
          await window.fUpdateDoc(window.fDoc(window.db, "cantieri", idDoc), { file: fileList });
        }
      } catch(e) {
        alert("Errore elimina file: " + e.message);
      }

      nascondiLoading();
    }

    function apriFile(url) {
      if (url) {
        window.open(url, '_blank');
      } else {
        alert("Link non valido.");
      }
    }

    function mostraCantieri() {
      let container = document.getElementById('listaCantieri');
      container.innerHTML = '';
      if (cantieriData.length === 0) {
        container.innerHTML = '<div class="empty" style="text-align:center; padding: 20px;">Nessun cantiere presente. Clicca su "Nuovo Cantiere" per iniziare.</div>';
        return;
      }

      cantieriData.forEach(c => {
        let cantiereAperto = cartelleAperte[c.idDoc] ? 'aperta' : '';
        let frecciaCantiere = cartelleAperte[c.idDoc] ? '▼' : '▶';

        let html = `
          <div class="folder-card">
            <div class="folder-header">
              <div class="folder-title" onclick="toggleCartella('${c.idDoc}')">
                <span>${frecciaCantiere} 📁</span> <span>${c.nome}</span>
              </div>
              <button class="btn-delete" onclick="eliminaCantiere('${c.idDoc}')" title="Elimina cantiere">🗑️</button>
            </div>
            
            <div class="folder-content ${cantiereAperto}">
              <button class="btn btn-sub" onclick="nuovaSottocartella('${c.idDoc}')">📂 + Aggiungi Sottocartella</button>
              <button class="btn btn-sub" style="background:#ea580c; color:#fff;" onclick="preparaCaricamento('${c.idDoc}')">📄 + Carica qui</button>

              <div class="file-list">
                ${(c.file || []).map(f => `
                  <div class="file-item">
                    <span class="file-name" onclick="apriFile('${f.url}')">📄 ${f.nome}</span>
                    <div class="file-actions">
                      <span class="file-badge ${f.tipo}">${f.tipo}</span>
                      <button class="btn-delete" onclick="eliminaFile('${c.idDoc}', '${f.id}')">🗑️</button>
                    </div>
                  </div>
                `).join('')}
              </div>

              <div class="subfolder-container">
                ${(c.sottocartelle || []).map(s => {
                  let subAperta = cartelleAperte[s.id] ? 'aperta' : '';
                  let frecciaSub = cartelleAperte[s.id] ? '▼' : '▶';
                  return `
                    <div>
                      <div class="subfolder-header">
                        <span onclick="toggleCartella('${s.id}')">${frecciaSub} 📂 ${s.nome}</span>
                        <div class="file-actions">
                          <button class="btn btn-sub" style="padding:2px 6px; font-size:0.7rem; background:#ea580c; color:#fff;" onclick="preparaCaricamento('${c.idDoc}', '${s.id}')">+ File</button>
                          <button class="btn-delete" onclick="eliminaSottocartella('${c.idDoc}', '${s.id}')">🗑️</button>
                        </div>
                      </div>
                      <div class="subfolder-content ${subAperta}">
                        <div class="file-list">
                          ${(!s.file || s.file.length === 0) ? '<div class="empty">Nessun file</div>' : ''}
                          ${(s.file || []).map(f => `
                            <div class="file-item">
                              <span class="file-name" onclick="apriFile('${f.url}')">📄 ${f.nome}</span>
                              <div class="file-actions">
                                <span class="file-badge ${f.tipo}">${f.tipo}</span>
                                <button class="btn-delete" onclick="eliminaFile('${c.idDoc}', '${f.id}', '${s.id}')">🗑️</button>
                              </div>
                            </div>
                          `).join('')}
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

          </div>
        `;
        container.innerHTML += html;
      });
    }
  </script>
</body>
</html>
