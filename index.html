<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocCantiere Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --accent: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --whatsapp: #22c55e;
      --email: #3b82f6;
      --danger: #ef4444;
      --backup: #8b5cf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding-bottom: 14px; 
      border-bottom: 2px solid var(--primary); 
      margin-bottom: 16px; 
    }

    h1 { 
      font-size: 1.4rem; 
      color: var(--text-main); 
      font-weight: 800; 
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge { 
      background: linear-gradient(135deg, var(--primary), var(--accent)); 
      color: #000; 
      font-size: 0.7rem; 
      padding: 4px 8px; 
      border-radius: 20px; 
      font-weight: 800; 
      text-transform: uppercase;
    }
    
    .btn-main { 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      color: white; 
      border: none; 
      padding: 15px; 
      border-radius: 14px; 
      font-size: 1rem; 
      font-weight: 800; 
      width: 100%; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3); 
      margin-bottom: 10px;
    }

    .btn-backup {
      background: linear-gradient(135deg, var(--backup), #6d28d9);
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .btn-main:active { transform: scale(0.98); }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0 20px 0;
    }

    .dash-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .dash-full {
      grid-column: span 2;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(249, 115, 22, 0.3);
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }

    .dash-title { font-size: 0.75rem; color: var(--text-sub); font-weight: 600; text-transform: uppercase; }
    .dash-value { font-size: 1.3rem; color: var(--accent); font-weight: 800; margin-top: 2px; }
    .dash-clock { font-size: 0.85rem; color: var(--text-main); font-weight: 700; }

      display: none;
      background: var(--card-bg);
      border: 1px solid var(--primary);
