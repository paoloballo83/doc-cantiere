<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocCantiere Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --accent: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --whatsapp: #22c55e;
      --email: #3b82f6;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding-bottom: 16px; 
      border-bottom: 2px solid var(--primary); 
      margin-bottom: 24px; 
    }

    h1 { 
      font-size: 1.5rem; 
      color: var(--text-main); 
      font-weight: 800; 
      letter-spacing: -0.5px; 
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge { 
      background: linear-gradient(135deg, var(--primary), var(--accent)); 
      color: #000; 
      font-size: 0.75rem; 
      padding: 4px 10px; 
      border-radius: 20px; 
      font-weight: 800; 
      text-transform: uppercase;
    }
    
    .btn { 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      color: white; 
      border: none; 
      padding: 14px 18px; 
      border-radius: 12px; 
      font-size: 1rem; 
      font-weight: 700; 
      width: 100%; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      margin-bottom: 14px; 
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25); 
    }
    
    .btn:active { transform: scale(0.98); }

    .btn-secondary {
      background: #334155;
      color: var(--accent);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    
    .folder-card { 
      background: var(--card-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 16px; 
      padding: 16px; 
      margin-bottom: 18px; 
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); 
    }

    .folder-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      font-weight: 700; 
      font-size: 1.15rem; 
      color: var(--text-main); 
    }

    .folder-title { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      flex-grow: 1; 
      cursor: pointer;
    }

    .folder-content { 
      display: none; 
      margin-top: 14px; 
      border-top: 1px solid var(--border-color); 
      padding-top: 12px; 
    }

    .folder-content.aperta { display: block; }
    
    .file-list { margin-top: 10px; }

    .file-item { 
      display: flex; 
      flex-direction: column;
      gap: 8px;
      padding: 12px; 
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .file-main-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .file-name { 
      cursor: pointer; 
      color: var(--accent); 
      font-weight: 600;
      font-size: 0.95rem; 
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .file-date {
      font-size: 0.75rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .file-actions { 
      display: flex; 
      align-items: center; 
      justify-content: flex-end;
      gap: 8px; 
      margin-top: 4px;
    }

    .btn-action { 
      border: none; 
      color: #fff; 
      padding: 8px 12px; 
      border-radius: 8px; 
      font-size: 0.8rem; 
      font-weight: 600;
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
    }

    .btn-whatsapp { background: var(--whatsapp); }
    .btn-email { background: var(--email); }
    .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 10px; border-radius: 8px; }
    
    .btn-sub { 
      background: #0f172a; 
      border: 1px dashed var(--primary); 
      font-size: 0.85rem; 
      padding: 10px 14px; 
      width: 100%; 
      margin-top: 6px; 
      color: var(--primary); 
      border-radius: 10px;
      font-weight: 600;
    }

    .empty { color: var(--text-sub); font-size: 0.85rem; font-style: italic; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <h1>🏗️ DocCantiere</h1>
    <span class="badge">PRO</span>
  </header>

  <button class="btn" onclick="nuovoCantiere()">➕ Nuovo Cantiere</button>
  
  <input type="file" id="fileInputGlobale" style="display:none;" accept="image/*,.pdf" onchange="gestisciFileSelezionato(event)">

  <div id="listaCantieri"></div>

  <script>
    const PASSWORD_ELIMINAZIONE = "1234";
    let cantieri = JSON.parse(localStorage.getItem('doc_cantiere_salvati_v15')) || [];
    let cantiereCorrenteId = null;

    function salvaDati() {
      localStorage.setItem('doc_cantiere_salvati_v15', JSON.stringify(cantieri));
      mostraCantieri();
    }

    function nuovoCantiere() {
      let nome = prompt("Nome del cantiere (es. Via Roma 12):");
      if (nome && nome.trim() !== "") {
        cantieri.push({ id: Date.now(), nome: nome.trim(), files: [] });
        salvaDati();
      }
    }

    function eliminaCantiere(id) {
      if (!confirm("Vuoi eliminare questo cantiere?")) return;
      let pwd = prompt("🔒 Inserisci la password (1234):");
      if (pwd !== PASSWORD_ELIMINAZIONE) {
        alert("❌ Password errata.");
        return;
      }
      cantieri = cantieri.filter(c => c.id !== id);
      salvaDati();
    }

    function avviaCaricamento(idCantiere) {
      cantiereCorrenteId = idCantiere;
      let input = document.getElementById('fileInputGlobale');
      input.value = '';
